<!DOCTYPE html>
<html>
<head>
    <title>Asymptote</title>
</head>
<body>

    <h1>Asymptote</h1>

    <div id="login-section">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Log In</button>
        <p id="login-status"></p>
    </div>

    <div id="app-section" style="display:none;">
        <p>Logged in.</p>

        <h2>Push</h2>
        <div id="push-list"></div>

        <h2>Pull</h2>
        <div id="pull-list"></div>

        <h2>Legs</h2>
        <div id="legs-list"></div>

        <h2>Uncategorized</h2>
        <div id="uncategorized-list"></div>

        <h2>Set Preferences</h2>
        <select id="exercise-select"></select>
        <input type="number" id="rep-min" placeholder="Rep min">
        <input type="number" id="rep-max" placeholder="Rep max">
        <input type="number" id="sets-per-session" placeholder="Sets per session">
        <input type="number" id="sessions-per-week" placeholder="Sessions per week">
        <select id="training-split-select">
            <option value="">No split</option>
            <option value="push">Push</option>
            <option value="pull">Pull</option>
            <option value="legs">Legs</option>
        </select>
        <button onclick="savePreference()">Save Preference</button>
        <p id="preference-status"></p>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let token = null;
        async function login() {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            const formData = new URLSearchParams();
            formData.append("username", email);
            formData.append("password", password);

            const response = await fetch(API_URL + "/users/login", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                token = data.access_token;
                document.getElementById("login-section").style.display = "none";
                document.getElementById("app-section").style.display = "block";
                loadQueue();
                populateExerciseDropdown();
            } else {
                document.getElementById("login-status").innerText = "Login failed";
            }
        }
        async function loadQueue() {
            const queueResponse = await fetch(API_URL + "/queue", {
                headers: { "Authorization": "Bearer " + token }
            });
            const queue = await queueResponse.json();

            const exercisesResponse = await fetch(API_URL + "/exercises");
            const exercises = await exercisesResponse.json();

            document.getElementById("push-list").innerHTML = "";
            document.getElementById("pull-list").innerHTML = "";
            document.getElementById("legs-list").innerHTML = "";
            document.getElementById("uncategorized-list").innerHTML = "";

            for (const item of queue) {
                const exercise = exercises.find(e => e.id === item.exercise_id);
                const name = exercise ? exercise.name : "Unknown";
                const repRange = item.target_rep_min && item.target_rep_max
                    ? item.target_rep_min + "-" + item.target_rep_max + " reps"
                    : "";
                const setsInfo = item.target_sets_per_session
                    ? item.target_sets_per_session + " sets"
                    : "";

                const div = document.createElement("div");
                div.innerHTML = `
                    <p>${name} (${setsInfo}, ${repRange})</p>
                    <input type="number" placeholder="Weight" id="weight-${item.id}">
                    <input type="number" placeholder="Reps" id="reps-${item.id}">
                    <input type="number" placeholder="RPE (optional)" id="rpe-${item.id}">
                    <button onclick="logSetForQueue(${item.id}, ${item.exercise_id})">Log Set</button>
                    <button onclick="completeQueueItem(${item.id})">Complete</button>
                    <button onclick="pushQueueItem(${item.id})">Push</button>
                    <hr>
                `;

                let targetContainerId = "uncategorized-list";
                if (item.training_split === "push") targetContainerId = "push-list";
                else if (item.training_split === "pull") targetContainerId = "pull-list";
                else if (item.training_split === "legs") targetContainerId = "legs-list";

                document.getElementById(targetContainerId).appendChild(div);
            }
        }
        async function completeQueueItem(id) {
            await fetch(API_URL + "/queue/" + id + "/complete", {
                method: "PATCH",
                headers: { "Authorization": "Bearer " + token }
            });
            loadQueue();
        }
        async function pushQueueItem(id) {
            await fetch(API_URL + "/queue/" + id + "/push", {
                method: "PATCH",
                headers: { "Authorization": "Bearer " + token }
            });
            loadQueue();
        }
        async function logSetForQueue(plannedSetId, exerciseId) {
            const weight = document.getElementById("weight-" + plannedSetId).value;
            const reps = document.getElementById("reps-" + plannedSetId).value;
            const rpe = document.getElementById("rpe-" + plannedSetId).value;

            await fetch(API_URL + "/sets", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    exercise_id: exerciseId,
                    set_number: 1,
                    weight_used: parseFloat(weight),
                    reps_completed: parseInt(reps),
                    rpe: rpe ? parseInt(rpe) : null,
                    planned_set_id: plannedSetId
                })
            });

            alert("Set logged!");
        }

        async function populateExerciseDropdown() {
            const response = await fetch(API_URL + "/exercises");
            const exercises = await response.json();

            const select = document.getElementById("exercise-select");
            select.innerHTML = "";

            for (const exercise of exercises) {
                const option = document.createElement("option");
                option.value = exercise.id;
                option.innerText = exercise.name;
                select.appendChild(option);
            }
        }

        async function savePreference() {
            const exerciseId = document.getElementById("exercise-select").value;
            const repMin = document.getElementById("rep-min").value;
            const repMax = document.getElementById("rep-max").value;
            const setsPerSession = document.getElementById("sets-per-session").value;
            const sessionsPerWeek = document.getElementById("sessions-per-week").value;
            const trainingSplit = document.getElementById("training-split-select").value;

            const response = await fetch(API_URL + "/preferences", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    exercise_id: parseInt(exerciseId),
                    target_rep_min: parseInt(repMin),
                    target_rep_max: parseInt(repMax),
                    target_sets_per_session: parseInt(setsPerSession),
                    target_sessions_per_week: parseInt(sessionsPerWeek),
                    training_split: trainingSplit ? trainingSplit : null
                })
            });

            if (response.ok) {
                document.getElementById("preference-status").innerText = "Preference saved!";
                loadQueue();
            } else {
                document.getElementById("preference-status").innerText = "Failed to save preference";
            }
        }
    </script>

</body>
</html>
